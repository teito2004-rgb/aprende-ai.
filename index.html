<!doctype html><html lang="pt-BR" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprende Aí</title><meta name="theme-color" content="#111714"><style>
:root{color-scheme:light;--bg:#fafbf9;--fg:#17231d;--surface:#fff;--border:#ddd;--muted:#e6efe9;--mutedfg:#17523f;--accent:#19805f;--line:#eee}
html[data-theme="dark"]{color-scheme:dark;--bg:#111714;--fg:#e8f0ea;--surface:#1c2721;--border:#34453a;--muted:#283b30;--mutedfg:#b9e5cd;--accent:#29936f;--line:#34453a}
body{transition:background .2s,color .2s;
margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}header{padding:24px;font-weight:800;display:flex;align-items:center;justify-content:space-between}#themeToggle{border:1px solid var(--border);background:var(--surface);color:var(--fg);font-weight:600;padding:10px 15px}main{max-width:760px;margin:9vh auto;padding:20px;text-align:center}h1{font-size:48px;letter-spacing:-2px}h1 span{color:var(--accent)}h2{font-weight:500}form{display:flex;gap:8px;border:1px solid var(--border);border-radius:30px;padding:8px;background:var(--surface)}input{flex:1;border:0;outline:0;padding:12px;font:inherit;min-width:0;background:transparent;color:var(--fg)}button{background:var(--accent);border:0;color:white;border-radius:25px;padding:14px;cursor:pointer}.times{margin:20px}.times button{margin:4px;background:var(--muted);color:var(--mutedfg)}.times button.on{background:var(--accent);color:white}#result{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:25px;margin-top:30px}article{padding:14px;border-top:1px solid var(--line)}a{color:var(--accent)}@media(max-width:550px){h1{font-size:38px}form{flex-direction:column;border-radius:18px}}</style><header><span>Aprende Aí</span><button id="themeToggle" type="button" aria-label="Alternar tema">🌙 Modo escuro</button></header><main><h1>Aprende <span>Aí.</span></h1><h2>O que você quer aprender hoje?</h2><form id="f"><input id="topic" placeholder="Ex.: editar vídeo, rebocar parede..." required><button>Aprender agora →</button></form><div class="times" id="times"><button data-n="15">15 min</button><button data-n="30">30 min</button><button data-n="60" class="on">1 hora</button><button data-n="120">2 horas</button><button data-n="180">3 horas</button></div><p>CH · Conhecimento Humano Aplicado</p><section id="result" hidden></section></main><script>
const themeButton=document.getElementById('themeToggle');
function applyTheme(theme){document.documentElement.dataset.theme=theme;themeButton.textContent=theme==='dark'?'☀️ Modo claro':'🌙 Modo escuro';themeButton.setAttribute('aria-pressed',String(theme==='dark'));document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#111714':'#fafbf9';try{localStorage.setItem('aprendeai-theme',theme)}catch(e){}}
let savedTheme='dark';try{savedTheme=localStorage.getItem('aprendeai-theme')||'dark'}catch(e){}
applyTheme(savedTheme);
themeButton.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
let n=60;
const form=document.querySelector('#f');
form.addEventListener('submit',async e=>{
 e.stopImmediatePropagation();e.preventDefault();
 const topic=document.querySelector('#topic').value.trim();if(!topic)return;
 const r=document.querySelector('#result');r.hidden=false;r.replaceChildren();
 const status=document.createElement('p');status.textContent='🎖️ Sargento preparando o curso com IA...';r.append(status);r.scrollIntoView({behavior:'smooth'});
 try{
 const resp=await fetch('/api/course',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,minutes:n})});
 const data=await resp.json();if(!resp.ok)throw Error(data.error||'Erro na geração');
 const c=data.course;r.replaceChildren();const h=document.createElement('h2');h.textContent=c.title;r.append(h);
 const obj=document.createElement('p');obj.textContent=c.objective;r.append(obj);
 c.modules.forEach((m,i)=>{const a=document.createElement('article'),h=document.createElement('h3'),ex=document.createElement('p'),act=document.createElement('p'),label=document.createElement('label'),check=document.createElement('input');h.textContent=`${i+1}. ${m.title} — ${m.minutes} min`;ex.textContent=m.explanation;act.textContent='🛠️ Aplicação: '+m.activity;check.type='checkbox';label.append(check,' Concluído');a.append(h,ex,act,label);r.append(a)});
 const quiztitle=document.createElement('h3');quiztitle.textContent='Teste de fixação';r.append(quiztitle);
 c.quiz.forEach((q,i)=>{const block=document.createElement('article'),h=document.createElement('h4'),fb=document.createElement('p');h.textContent=`${i+1}. ${q.question}`;block.append(h);q.options.forEach((o,j)=>{const b=document.createElement('button');b.textContent=o;b.style.cssText='display:block;margin:8px 0;text-align:left';b.onclick=()=>{fb.textContent=(j===q.correct?'✔ Correto. ':'Revise: ')+q.explanation};block.append(b)});block.append(fb);r.append(block)});
 if(c.searchQueries?.length){const title=document.createElement('h3');title.textContent='Encontrar vídeos e materiais (pesquisa externa, não verificada)';r.append(title);c.searchQueries.forEach(q=>{const p=document.createElement('p'),a=document.createElement('a');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Pesquisar no YouTube: '+q;p.append(a);r.append(p)})}
 if(c.safetyNote){const p=document.createElement('p');p.textContent='Atenção: '+c.safetyNote;r.append(p)}
 }catch(err){status.textContent='Não foi possível acionar o Sargento: '+err.message;}
 },true);

const lessons=[
{terms:/deus|fé|bíblia|oração|jesus|cristian/i,title:'Introdução ao estudo bíblico',sources:[['Bíblia online — Sociedade Bíblica do Brasil','https://www.sbb.org.br/']],questions:[['Qual é uma boa prática para compreender um texto bíblico?',['Ler o contexto do trecho','Ler apenas uma frase isolada','Ignorar o gênero do texto'],0]],practice:'Escolha uma passagem curta, escreva com suas palavras a mensagem principal e uma pergunta que deseja investigar.'},
{terms:/reboc|argamassa|parede|concreto|pedreiro/i,title:'Noções de revestimento de paredes',sources:[['SENAI — cursos e formação','https://www.sp.senai.br/']],questions:[['Antes de aplicar um revestimento, o que deve ser avaliado?',['Apenas a cor','A condição da base e a especificação dos materiais','Somente a temperatura da água'],1]],practice:'Em uma situação hipotética, uma parede está com partes soltas. Descreva o que deve ser verificado antes de iniciar o revestimento. Não execute serviços de obra sem orientação técnica e EPIs.'},
{terms:/edição|editar|vídeo|premiere|capcut|audiovisual/i,title:'Edição de vídeo com recursos digitais',sources:[['Adobe — edição baseada em texto','https://helpx.adobe.com/premiere/desktop/edit-projects/edit-video-using-text-based-editing/overview-of-text-based-editing.html'],['Blackmagic — treinamento DaVinci Resolve','https://www.blackmagicdesign.com/br/products/davinciresolve/training/']],questions:[['O que costuma ajudar na clareza de um vídeo curto?',['Manter todas as pausas','Cortes guiados pela mensagem','Adicionar efeitos em toda cena'],1]],practice:'Planeje um vídeo de 30 segundos com começo, desenvolvimento e encerramento. Escreva onde faria três cortes.'},
{terms:/cachorro|cão|pet|tosa|tosar/i,title:'Cuidados responsáveis com cães',sources:[['Conselho Federal de Medicina Veterinária','https://www.cfmv.gov.br/']],questions:[['Ao perceber dor ou irritação na pele durante cuidados com o cão, o mais indicado é:',['Insistir no procedimento','Interromper e procurar orientação veterinária','Usar qualquer produto caseiro'],1]],practice:'Monte uma lista de cuidados básicos para o cão e identifique quais exigem acompanhamento profissional.'}
];
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelector('#f').onsubmit=e=>{e.preventDefault();let t=document.querySelector('#topic').value.trim(),r=document.querySelector('#result');if(!t)return;r.hidden=false;let parts=[['Compreender',.2,'Identifique conceitos essenciais'],['Observar',.3,'Estude demonstrações e exemplos'],['Aplicar',.3,'Resolva um cenário virtual e descreva sua decisão'],['Revisar',.2,'Responda: quais são três passos e um erro a evitar?']];let times=parts.map(x=>Math.floor(n*x[1]));times[3]+=n-times.reduce((a,b)=>a+b,0);r.replaceChildren();let h=document.createElement('h2');h.textContent=t+' · '+n+' minutos';r.append(h);let p=document.createElement('p');p.textContent='Trilha demonstrativa. A pesquisa automática do Sargento ainda não está conectada.';r.append(p);let selected=lessons.find(x=>x.terms.test(t));if(selected){let intro=document.createElement('p');intro.textContent='Tema relacionado: '+selected.title+'. Conteúdo inicial selecionado para estudo; o Sargento com pesquisa automática ainda será integrado.';r.append(intro)}parts.forEach((x,i)=>{let a=document.createElement('article'),h=document.createElement('h3'),d=document.createElement('p'),l=document.createElement('label'),c=document.createElement('input');h.textContent=(i+1)+'. '+x[0]+' — '+times[i]+' min';d.textContent=x[2];c.type='checkbox';l.append(c,' Concluído');a.append(h,d,l);r.append(a)});if(selected){
 let title=document.createElement('h3');title.textContent='Fontes para começar';r.append(title);
 selected.sources.forEach(([label,url])=>{let p=document.createElement('p'),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;p.append(a);r.append(p)});
 let q=selected.questions[0],h=document.createElement('h3');h.textContent='Teste de fixação';r.append(h);let question=document.createElement('p');question.textContent=q[0];r.append(question);
 let group=document.createElement('div'),feedback=document.createElement('p');q[1].forEach((option,j)=>{let b=document.createElement('button');b.textContent=option;b.style.cssText='display:block;margin:8px 0;text-align:left';b.onclick=()=>{feedback.textContent=j===q[2]?'Correto! Você identificou o princípio.':'Ainda não. Releia a explicação e tente novamente.'};group.append(b)});r.append(group,feedback);
 let hp=document.createElement('h3');hp.textContent='Desafio CH · Conhecimento Humano Aplicado';let task=document.createElement('p');task.textContent=selected.practice;let area=document.createElement('textarea');area.placeholder='Escreva aqui sua resposta...';area.style.cssText='width:100%;min-height:100px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg)';r.append(hp,task,area);
}else{let p=document.createElement('p');p.textContent='Ainda não temos uma trilha específica verificada para esse assunto. A pesquisa automática do Sargento será integrada em uma próxima versão.';r.append(p)}r.scrollIntoView({behavior:'smooth'})}</script></html>
