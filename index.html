<!doctype html><html lang="pt-BR" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprende Aí</title><meta name="theme-color" content="#111714"><style>
:root{color-scheme:light;--bg:#fafbf9;--fg:#17231d;--surface:#fff;--border:#ddd;--muted:#e6efe9;--mutedfg:#17523f;--accent:#19805f;--line:#eee}
html[data-theme="dark"]{color-scheme:dark;--bg:#111714;--fg:#e8f0ea;--surface:#1c2721;--border:#34453a;--muted:#283b30;--mutedfg:#b9e5cd;--accent:#29936f;--line:#34453a}
body{transition:background .2s,color .2s;
margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}header{padding:24px;font-weight:800;display:flex;align-items:center;justify-content:space-between}#themeToggle{border:1px solid var(--border);background:var(--surface);color:var(--fg);font-weight:600;padding:10px 15px}main{max-width:760px;margin:9vh auto;padding:20px;text-align:center}h1{font-size:48px;letter-spacing:-2px}h1 span{color:var(--accent)}h2{font-weight:500}form{display:flex;gap:8px;border:1px solid var(--border);border-radius:30px;padding:8px;background:var(--surface)}input{flex:1;border:0;outline:0;padding:12px;font:inherit;min-width:0;background:transparent;color:var(--fg)}button{background:var(--accent);border:0;color:white;border-radius:25px;padding:14px;cursor:pointer}.times{margin:20px}.times button{margin:4px;background:var(--muted);color:var(--mutedfg)}.times button.on{background:var(--accent);color:white}#result{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:25px;margin-top:30px}article{padding:14px;border-top:1px solid var(--line)}a{color:var(--accent)}@media(max-width:550px){h1{font-size:38px}form{flex-direction:column;border-radius:18px}}select{padding:10px;border-radius:12px;background:var(--surface);color:var(--fg);border:1px solid var(--border)}textarea{box-sizing:border-box;width:100%;min-height:85px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;margin:8px 0}input[type=checkbox]{width:auto}progress{width:100%;accent-color:var(--accent)}.source{border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}.source small{display:block;margin-top:6px}.muted{font-size:13px;opacity:.8}.badge{font-size:13px;color:var(--mutedfg)}.answer{display:block;text-align:left;margin:8px 0}button:disabled{opacity:.65;cursor:wait}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.video-shell{position:relative;margin-top:12px}
.video-shell iframe{display:block;width:100%;aspect-ratio:16/9;min-height:200px;border:0}
.video-toolbar{display:none}
.expand-video{margin-top:10px}
.video-shell.is-expanded{position:fixed;inset:0;z-index:10000;margin:0;padding:calc(70px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));box-sizing:border-box;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.video-shell.is-expanded iframe{width:100%;max-width:1200px;max-height:calc(100dvh - 110px);flex-shrink:1;background:#000}
.video-shell.is-expanded .video-toolbar{display:flex;position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;justify-content:space-between;align-items:center;gap:12px;color:#fff}
.video-toolbar button{background:#333;color:#fff;border:1px solid #777;padding:10px 16px}
.video-caption{font-size:13px;line-height:1.5}
@media(max-width:550px){main{padding:10px}#result{padding:10px}article{padding:14px 0}.source{padding:8px}.video-shell:not(.is-expanded){margin-left:-8px;margin-right:-8px}.video-shell.is-expanded{padding-left:0;padding-right:0}}
</style><header><span>Aprende Aí</span><button id="themeToggle" type="button" aria-label="Alternar tema">🌙 Modo escuro</button></header><main><h1>Aprende <span>Aí.</span></h1><h2>O que você quer aprender hoje?</h2><form id="f"><input maxlength="180" aria-label="O que você quer aprender?" id="topic" placeholder="Ex.: editar vídeo, rebocar parede..." required><button>Aprender agora →</button></form><div class="times" id="times"><button data-n="15">15 min</button><button data-n="30">30 min</button><button data-n="60" class="on">1 hora</button><button data-n="120">2 horas</button><button data-n="180">3 horas</button></div><label for="level">Seu nível: </label><select id="level"><option value="iniciante">Iniciante</option><option value="intermediário">Intermediário</option><option value="avançado">Avançado</option></select><p>CHA · Conhecimento Humano Aplicado</p><section id="result" hidden></section></main><script>
const $=s=>document.querySelector(s);
const themeButton=$('#themeToggle');
function theme(value){document.documentElement.dataset.theme=value;themeButton.textContent=value==='dark'?'☀️ Modo claro':'🌙 Modo escuro';try{localStorage.setItem('aprendeai-theme',value)}catch{}}
let saved='dark';try{saved=localStorage.getItem('aprendeai-theme')||saved}catch{}theme(saved);
themeButton.onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let minutes=60;
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{minutes=Number(b.dataset.n);document.querySelectorAll('[data-n]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))})});
function el(tag,text,parent){const node=document.createElement(tag);if(text)node.textContent=text;if(parent)parent.append(node);return node}


let playerAPIPromise;
function youtubePlayerAPI(){
 if(window.YT?.Player)return Promise.resolve(window.YT);
 if(playerAPIPromise)return playerAPIPromise;
 playerAPIPromise=new Promise(resolve=>{
  const previous=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{try{previous?.()}finally{resolve(window.YT)}};
  const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.async=true;script.onerror=()=>resolve(null);document.head.append(script);
 });
 return playerAPIPromise;
}

let expandedVideo=null;
function clock(seconds){const n=Math.floor(seconds);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function closeExpandedVideo(){
 if(!expandedVideo)return;
 const {shell,trigger,overflow,onKey,placeholder,scrollX,scrollY}=expandedVideo;
 if(document.fullscreenElement===shell)document.exitFullscreen().catch(()=>{});
 shell.classList.remove('is-expanded');shell.removeAttribute('role');shell.removeAttribute('aria-modal');
 document.body.style.overflow=overflow;document.removeEventListener('keydown',onKey);
 placeholder.remove();expandedVideo=null;window.scrollTo(scrollX,scrollY);trigger.focus({preventScroll:true});
}
async function installVideo(card,source,url){
 const videoId=url.hostname==='youtu.be'?url.pathname.slice(1):/(^|\.)youtube\.com$/.test(url.hostname)?url.searchParams.get('v')||url.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1]:null;
 if(!videoId||!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;
 const checking=el('p','Verificando se o vídeo está disponível…',card);checking.setAttribute('role','status');
 let availability;
 try{const response=await fetch('/api/video-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[videoId]}),signal:AbortSignal.timeout(8000)});const data=await response.json();availability=data.videos?.find(v=>v.id===videoId)}catch{}
 if(!card.isConnected)return;
 if(availability?.status!=='available'){card.replaceChildren();el('p',availability?.status==='unavailable'?'Vídeo indisponível, privado ou com reprodução restrita. Ele foi retirado desta trilha. Use outra fonte da etapa ou gere uma nova trilha.':'Não foi possível confirmar este vídeo agora. O player não será exibido até a verificação. Reabra a trilha para tentar novamente.',card);return}
 checking.remove();if(availability.title)card.querySelector('a').textContent=availability.title;
 const clip=source.clip;
 const hasClip=clip?.basis==='transcript'&&Number.isInteger(clip.startSeconds)&&Number.isInteger(clip.endSeconds)&&clip.startSeconds>=0&&clip.endSeconds>clip.startSeconds;
 const params=new URLSearchParams({playsinline:'1',enablejsapi:'1',origin:location.origin});
 if(hasClip){params.set('start',String(clip.startSeconds));params.set('end',String(clip.endSeconds));const external=new URL(url);external.searchParams.set('t',clip.startSeconds+'s');card.querySelector('a').href=external.href}
 const note=el('p',hasClip?'Trecho indicado: '+clock(clip.startSeconds)+'–'+clock(clip.endSeconds)+' · selecionado pela transcrição':source.transcript?.status==='available'?'Transcrição consultada; nenhum trecho com horário foi confirmado.':'Sem transcrição analisada: o vídeo começa do início.',card);note.className='video-caption';
 const shell=el('div','',card);shell.className='video-shell';shell.setAttribute('aria-label',source.title);
 const toolbar=el('div','',shell);toolbar.className='video-toolbar';
 const close=el('button','Fechar ×',toolbar);close.type='button';close.onclick=closeExpandedVideo;
 const full=el('button','Tela inteira ⛶',toolbar);full.type='button';full.onclick=async()=>{try{if(document.fullscreenElement===shell)await document.exitFullscreen();else if(shell.requestFullscreen)await shell.requestFullscreen()}catch{}};
 if(!shell.requestFullscreen)full.hidden=true;
 const frame=el('iframe','',shell);frame.src='https://www.youtube-nocookie.com/embed/'+videoId+'?'+params;frame.title=source.title;frame.loading='lazy';frame.allow='fullscreen; picture-in-picture; encrypted-media';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';
 const expand=el('button','Ampliar vídeo ⛶',card);expand.className='expand-video';expand.type='button';expand.setAttribute('aria-label','Ampliar vídeo: '+source.title);
 expand.onclick=()=>{
  closeExpandedVideo();
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();closeExpandedVideo()}else if(e.key==='Tab'){const controls=[close,...(full.hidden?[]:[full]),frame];const i=controls.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();frame.focus()}else if(!e.shiftKey&&i===controls.length-1){e.preventDefault();close.focus()}}};
  const placeholder=document.createElement('div');placeholder.style.height=(shell.getBoundingClientRect().height+12)+'px';shell.before(placeholder);expandedVideo={shell,trigger:expand,overflow:document.body.style.overflow,onKey,placeholder,scrollX:window.scrollX,scrollY:window.scrollY};
  shell.classList.add('is-expanded');shell.setAttribute('role','dialog');shell.setAttribute('aria-modal','true');document.body.style.overflow='hidden';document.addEventListener('keydown',onKey);close.focus({preventScroll:true});
 };
 shell.addEventListener('click',e=>{if(e.target===shell)closeExpandedVideo()});
 youtubePlayerAPI().then(YT=>{
  if(!YT||!frame.isConnected)return;
  new YT.Player(frame,{events:{onError:event=>{
   if(![2,5,100,101,150,153].includes(Number(event.data)))return;
   if(expandedVideo?.shell===shell)closeExpandedVideo();
   frame.remove();expand.remove();toolbar.remove();
   const unavailable=Number(event.data)===100;
   if(unavailable)card.querySelector('a')?.remove();
   note.textContent=unavailable?'Este vídeo foi removido ou ficou privado. Use outra fonte desta etapa ou gere uma nova trilha.':'Este vídeo não permitiu a reprodução aqui. Use outra fonte da etapa ou o link para abrir no YouTube.';
   note.setAttribute('role','status');
  }}});
 }).catch(()=>{});

}

function render(data,key){
 closeExpandedVideo();
 const r=$('#result'),c=data.course;r.replaceChildren();el('h2',c.title,r);el('p',c.objective,r);
 el('p','CHA · '+c.modules.reduce((n,m)=>n+m.minutes,0)+' minutos de estudo estimado',r).className='badge';
 if(data.research){el('p',data.research.note,r).className='muted';el('p','Pesquisa realizada em '+new Date(data.research.checkedAt).toLocaleString('pt-BR'),r).className='muted'}
 let progress={};try{progress=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
 const progressText=el('p','',r),bar=el('progress','',r);bar.max=5;
 function update(){const count=c.modules.filter((_,i)=>progress[i]).length;progressText.textContent=count+' de 5 etapas concluídas';bar.value=count;try{localStorage.setItem(key,JSON.stringify(progress))}catch{}}
 c.modules.forEach((m,i)=>{const a=el('article','',r);el('span',m.stage||'Etapa '+(i+1),a).className='badge';el('h3',m.title+' — '+m.minutes+' min',a);el('p',m.explanation,a);
 if(m.focus)el('p','Ao estudar: '+m.focus,a);
 (m.sources||[]).forEach(s=>{let url;try{url=new URL(s.url)}catch{return}if(url.protocol!=='https:')return;const card=el('div','',a);card.className='source';const link=el('a',s.title,card);link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';el('small',s.platform+' · '+s.publisher,card);el('small',s.access?.status==='accessible'?'Link respondeu à verificação · Abrir ↗':'Acesso automático não confirmado · Abrir ↗',card);installVideo(card,s,url)});
 el('p','Prática: '+m.activity,a);const field=el('textarea','',a);field.placeholder='Anote aqui o que aprendeu ou sua resposta…';field.setAttribute('aria-label','Anotações da etapa '+(i+1));field.value=progress['note'+i]||'';field.oninput=()=>{progress['note'+i]=field.value;update()};
 const label=el('label','',a),check=el('input','',label);check.type='checkbox';check.checked=!!progress[i];check.onchange=()=>{progress[i]=check.checked;update()};label.append(' Concluí esta etapa');
 });update();
 el('h3','Teste de fixação',r);c.quiz.forEach((q,i)=>{const block=el('article','',r);el('h4',(i+1)+'. '+q.question,block);const feedback=el('p','',block);feedback.setAttribute('aria-live','polite');q.options.forEach((o,j)=>{const b=el('button',o,block);b.className='answer';b.onclick=()=>{feedback.textContent=(j===q.correct?'✓ Correto. ':'Vamos revisar. ')+q.explanation}})});
 if(c.summary){el('h3','Para levar com você',r);el('p',c.summary,r)}if(c.safetyNote)el('p',c.safetyNote,r);
}

function renderClarification(clarification){
 const r=$('#result');r.replaceChildren();el('h2','Vamos definir o assunto',r);el('p',clarification.question,r);
 function choose(topic){$('#topic').value=topic;$('#f').dataset.clarified='true';$('#f').requestSubmit()}
 clarification.options.forEach(option=>{const button=el('button',option.label,r);button.className='answer';button.type='button';button.onclick=()=>choose(option.topic)});
 el('p','Ou descreva com suas palavras:',r);const input=el('input','',r);input.placeholder='Ex.: conquistar metas profissionais';input.maxLength=180;input.setAttribute('aria-label','Esclareça o que deseja aprender');input.style.cssText='box-sizing:border-box;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--bg);margin:8px 0';
 const confirm=el('button','Usar este tema',r);confirm.type='button';confirm.onclick=()=>{if(input.value.trim())choose(input.value.trim());else input.focus()};input.onkeydown=e=>{if(e.key==='Enter')confirm.click()};
}

$('#f').addEventListener('submit',async e=>{
 e.preventDefault();const topic=$('#topic').value.trim();if(!topic)return;
 const button=$('#f button'),r=$('#result');button.disabled=true;button.textContent='Preparando…';r.hidden=false;r.replaceChildren();r.setAttribute('aria-busy','true');
 const status=el('p','🎖️ Sargento pesquisando materiais e preparando sua trilha…',r);status.setAttribute('role','status');el('p','Isso pode levar cerca de um minuto.',r);r.scrollIntoView({behavior:'smooth',block:'start'});
 const chosen=minutes,level=$('#level').value,clarified=$('#f').dataset.clarified==='true';delete $('#f').dataset.clarified;
 try{const response=await fetch('/api/course',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,minutes:chosen,level,clarified}),signal:AbortSignal.timeout(125000)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Não consegui preparar a trilha agora. Tente novamente.');if(data.clarification){renderClarification(data.clarification);return}if(!data.course)throw Error('A trilha não foi concluída. Tente novamente.');const key='aprendeai-progress:'+JSON.stringify([topic.toLowerCase(),chosen,level,data.course.title]);render(data,key);try{localStorage.setItem('aprendeai-last-course',JSON.stringify({data,key,topic,minutes:chosen,level}))}catch{}}
 catch(err){r.replaceChildren();el('p',err.name==='TimeoutError'?'A preparação demorou mais que o esperado. Tente novamente.':err.message,r).setAttribute('role','alert');}
 finally{button.disabled=false;button.textContent='Aprender agora →';r.setAttribute('aria-busy','false')}
});
try{const last=JSON.parse(localStorage.getItem('aprendeai-last-course')||'null');if(last?.data?.course){$('#topic').value=last.topic;$('#level').value=last.level;minutes=last.minutes;document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',Number(b.dataset.n)===minutes));$('#result').hidden=false;render(last.data,last.key)}}catch{}
</script></html>
